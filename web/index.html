        // Clean up any legacy flutter_service_worker.js or duplicate FCM SW on wrong scope
        if ('serviceWorker' in navigator) {
          const expectedScope = new URL('firebase-cloud-messaging-push-scope', document.baseURI).href;
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const r of regs) {
              const url = (r.active && r.active.scriptURL) || (r.waiting && r.waiting.scriptURL) || (r.installing && r.installing.scriptURL) || '';
              if (url.includes('flutter_service_worker.js')) {
                r.unregister();
              } else if (url.includes('firebase-messaging-sw.js') && !r.scope.startsWith(expectedScope)) {
                r.unregister();
              }
            }
          }).catch(() => {});
        }
        const VAPID_KEY = "BHJPisbQ33JIcNhSCJDsN_ci9ZvCSfC87hfdcJQTNrC0-h78dRsuyszzVNk1GfcztAE9SqELRc9N5wlgu0L9JHg";

        window.mabnaGetPushPermission = function () {
          if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) {
            return 'unsupported';
          }
          return Notification.permission || 'default';
        };

        let _onMessageBound = false;
        function bindForegroundListener(reg) {
          if (_onMessageBound) return;
          _onMessageBound = true;
          const messaging = firebase.messaging();
          messaging.onMessage((payload) => {
            console.log('MABNA FCM message received:', payload);
            const title = payload?.data?.title || payload?.notification?.title || 'MABNA CARE';
            const body = payload?.data?.body || payload?.notification?.body || '';
            const icon = payload?.data?.icon || new URL('icons/Icon-192.png', document.baseURI).href;
            const badge = payload?.data?.badge || new URL('icons/notification-badge.png', document.baseURI).href;
            const tag = payload?.data?.tag || payload?.notification?.tag || 'mabna-care-notification';
            if (Notification.permission === 'granted') {
              try {
                new Notification(title, { body, icon, badge, tag });
              } catch (_) {
                if (reg && reg.showNotification) {
                  reg.showNotification(title, { body, icon, badge, tag });
                }
              }
            }
          });
        }

        async function registerFcmSw() {
          const swUrl = new URL('firebase-messaging-sw.js', document.baseURI).href;
          const swScope = new URL('firebase-cloud-messaging-push-scope', document.baseURI).pathname;
          const reg = await navigator.serviceWorker.register(swUrl, { scope: swScope });
          // Wait until reg.active is actually activated (PushManager.subscribe requires an active SW)
          const start = Date.now();
          while ((!reg.active || reg.active.state !== 'activated') && Date.now() - start < 7000) {
            await new Promise((r) => setTimeout(r, 120));
          }
          return reg;
        }

        // Auto-bind foreground listener on load if already granted
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && 'serviceWorker' in navigator) {
          registerFcmSw().then(bindForegroundListener).catch(() => {});
        }

        window.mabnaRequestPushToken = async function (silentOnly) {
          try {
            if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) {
              return '';
            }
            let perm = Notification.permission;
            if (silentOnly && perm !== 'granted') return '';
            if (perm !== 'granted') {
              perm = await Notification.requestPermission();
            }
            if (perm !== 'granted') return '';

            const reg = await registerFcmSw();
            bindForegroundListener(reg);
            const messaging = firebase.messaging();
            let token = '';
            try {
              token = await messaging.getToken({
                vapidKey: VAPID_KEY,
                serviceWorkerRegistration: reg
              });
            } catch (firstErr) {
              console.warn('Retrying FCM getToken after reset:', firstErr);
              try {
                await messaging.deleteToken();
              } catch (_) {}
              await new Promise((r) => setTimeout(r, 300));
              token = await messaging.getToken({
                vapidKey: VAPID_KEY,
                serviceWorkerRegistration: reg
              });
            }
            return token || '';
          } catch (e) {
            console.warn('MABNA Push error:', e);
            return '';
          }
        };

        let _autoPromptStarted = false;
        window.mabnaAutoPromptPushToken = async function () {
          try {
            if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) {
              return '';
            }
            if (Notification.permission === 'granted') {
              return await window.mabnaRequestPushToken(true);
            }
            if (Notification.permission === 'denied' || _autoPromptStarted) {
              return '';
            }
            _autoPromptStarted = true;

            // 1. Try requesting permission immediately on app open
            try {
              const immediatePerm = await Notification.requestPermission();
              if (immediatePerm === 'granted') {
                return await window.mabnaRequestPushToken(true);
              }
              if (immediatePerm === 'denied') {
                return '';
              }
            } catch (_) {}

            // 2. Fallback if browser requires a user gesture: prompt on first tap/click anywhere
            if (Notification.permission === 'default') {
              await new Promise((resolve) => {
                const handler = () => {
                  window.removeEventListener('click', handler, true);
                  window.removeEventListener('touchend', handler, true);
                  resolve();
                };
                window.addEventListener('click', handler, true);
                window.addEventListener('touchend', handler, true);
              });
              const gesturePerm = await Notification.requestPermission();
              if (gesturePerm === 'granted') {
                return await window.mabnaRequestPushToken(true);
              }
            }
            return '';
          } catch (e) {
            console.warn('MABNA Auto Push prompt error:', e);
            return '';
          }
        };
      } catch (e) {
        console.warn('Firebase init skipped:', e);
      }

      // Capture native PWA install prompt (Android / Desktop Chrome)
      window._mabnaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window._mabnaInstallPrompt = e;
      });
      window.addEventListener('appinstalled', () => {
        window._mabnaInstallPrompt = null;
      });
      window.mabnaIsStandalone = function () {
        return (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        );
      };
      window.mabnaCanInstallPrompt = function () {
        return window._mabnaInstallPrompt != null;
      };
      window.mabnaTriggerInstallPrompt = async function () {
        const promptEvent = window._mabnaInstallPrompt;
        if (!promptEvent) return false;
        promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        window._mabnaInstallPrompt = null;
        return choice && choice.outcome === 'accepted';
      };

      // Client-side Canvas JPEG compressor for fast receipt uploads on mobile web
      window.mabnaCompressImage = function (base64In, maxDim, quality) {
        return new Promise((resolve) => {
          try {
            const img = new Image();
            img.onload = function () {
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (w > maxDim || h > maxDim) {
                if (w >= h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              if (!ctx) { resolve(''); return; }
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.72);
              const comma = dataUrl.indexOf(',');
              resolve(comma >= 0 ? dataUrl.slice(comma + 1) : '');
            };
            img.onerror = function () { resolve(''); };
            img.src = 'data:image/*;base64,' + base64In;
          } catch (_) {
            resolve('');
          }
        });
      };

      // Native Contact Picker API (supported on Android Chrome / Chromium mobile)
      window.mabnaCanPickContact = function () {
        return !!(navigator.contacts && typeof navigator.contacts.select === 'function');
      };
      window.mabnaPickContact = async function () {
        try {
          if (!window.mabnaCanPickContact()) return '';
          const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (!contacts || !contacts.length) return '';
          const first = contacts[0] || {};
          const rawName = Array.isArray(first.name) && first.name.length ? String(first.name[0] || '').trim() : '';
          const rawTel = Array.isArray(first.tel) && first.tel.length ? String(first.tel[0] || '').trim() : '';
          const arabicDigits = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
          let digits = rawTel.replace(/[٠-٩]/g, (d) => arabicDigits[d] || d).replace(/[^0-9]/g, '');
          if (digits.startsWith('0020')) digits = '0' + digits.slice(4);
          else if (digits.startsWith('20') && digits.length >= 11) digits = '0' + digits.slice(2);
          return JSON.stringify({ name: rawName, phone: digits });
        } catch (_) {
          return '';
        }
      };
    })();
